spring.application.name=CareerLinkAuthService

server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/careerlink_auth
spring.datasource.username=postgres
spring.datasource.password=Sanath@0810
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:8081
eureka.instance.status-page-url=http://localhost:8081
eureka.instance.home-page-url=http://localhost:8081

# JWT
jwt.secret=careerlink-super-secret-key-must-be-at-least-32-chars
jwt.expiration=86400000